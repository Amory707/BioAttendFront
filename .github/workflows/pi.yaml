name: Deploy to Raspberry Pi
on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PI_HOST: ${{ secrets.PI_HOST }}
      PI_USER: "bioattend"
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      SSHPASS: ${{ secrets.PI_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v2 # v2 est la version stable recommandée
        with:
          authkey: ${{ env.TAILSCALE_AUTHKEY }}

      - name: Verify Tailscale connectivity
        run: |
          set -euo pipefail
          echo "Statut Tailscale:"
          tailscale status
          echo ""
          echo "Test de ping vers ${PI_HOST}..."
          tailscale ping --c 1 "${PI_HOST}" || true

      - name: Wait for Pi via SSH
        run: |
          set -euo pipefail
          MAX_ATTEMPTS=15
          for i in $(seq 1 $MAX_ATTEMPTS); do
            if sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=45 "${PI_USER}@${PI_HOST}" "true" >/dev/null 2>&1; then
              echo "✅ Pi joignable"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Create deploy directory on Raspberry Pi
        run: |
          set -euo pipefail
          BRANCH="${{ github.ref_name }}"
          DEPLOY_PATH="/home/bioattend/${BRANCH}"
          echo "Création du répertoire: ${DEPLOY_PATH}"
          sshpass -e ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            "${PI_USER}@${PI_HOST}" "mkdir -p '${DEPLOY_PATH}' && ls -la /home/bioattend/"

      - name: Sync files to Raspberry Pi
        run: |
          set -euo pipefail
          BRANCH="${{ github.ref_name }}"
          DEPLOY_PATH="/home/bioattend/${BRANCH}"
          echo "Synchronisation vers: ${PI_USER}@${PI_HOST}:${DEPLOY_PATH}"
          sshpass -e rsync -avz --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "venv" \
            --exclude "__pycache__" \
            --exclude "*.pyc" \
            --timeout=30 \
            -e "ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10" \
            ./ "${PI_USER}@${PI_HOST}:${DEPLOY_PATH}/"
          echo "✅ Fichiers synchronisés"

      - name: Install Python dependencies in branch venv
        run: |
          set -euo pipefail
          BRANCH="${{ github.ref_name }}"
          DEPLOY_PATH="/home/bioattend/${BRANCH}"
          echo "Installation des dépendances Python dans ${DEPLOY_PATH}..."
          sshpass -e ssh -o StrictHostKeyChecking=no "${PI_USER}@${PI_HOST}" bash << EOF
            set -euo pipefail
            cd "${DEPLOY_PATH}"
            echo "Répertoire actuel : \$(pwd)"
            
            if [ ! -d venv ]; then
              echo "Création du venv..."
              python3 -m venv --system-site-packages venv
            fi
            
            . venv/bin/activate
            echo "Installation des requirements..."
            if [ -f requirements.txt ]; then
              pip install --upgrade pip setuptools wheel
              pip install -r requirements.txt
              echo "✅ Dépendances installées avec succès"
            else
              echo "⚠️ requirements.txt non trouvé"
              exit 1
            fi
          EOF

      - name: Start app automatically on Raspberry Pi
        run: |
          set -euo pipefail
          BRANCH="${{ github.ref_name }}"
          DEPLOY_PATH="/home/bioattend/${BRANCH}"
          echo "Démarrage automatique de l'application depuis ${DEPLOY_PATH}..."
          sshpass -e ssh -o StrictHostKeyChecking=no "${PI_USER}@${PI_HOST}" "BRANCH='${BRANCH}' DEPLOY_PATH='${DEPLOY_PATH}' bash -s" << 'EOF'
            set -euo pipefail
            BRANCH="${BRANCH}"
            DEPLOY_PATH="${DEPLOY_PATH}"
            BRANCH_SLUG="$(printf '%s' "${BRANCH}" | tr '/ ' '__')"
            LOG_DIR="/home/bioattend/.bioattend"
            APP_LOG="${LOG_DIR}/app-${BRANCH_SLUG}.log"
            PID_FILE="${LOG_DIR}/app-${BRANCH_SLUG}.pid"

            mkdir -p "${LOG_DIR}"
            cd "${DEPLOY_PATH}"

            if [ ! -f app.py ]; then
              echo "❌ app.py introuvable dans ${DEPLOY_PATH}"
              exit 1
            fi

            if [ -f "${PID_FILE}" ] && kill -0 "$(cat "${PID_FILE}")" 2>/dev/null; then
              kill "$(cat "${PID_FILE}")" || true
              sleep 1
            fi

            # Coupe un ancien serveur Flask lié à cette app pour éviter les conflits de port.
            pkill -f "python -m flask --app app run --host 0.0.0.0 --port 5000" || true

            nohup "${DEPLOY_PATH}/venv/bin/python" -m flask --app app run --host 0.0.0.0 --port 5000 > "${APP_LOG}" 2>&1 &
            echo $! > "${PID_FILE}"
            sleep 3

            if curl -fsS "http://127.0.0.1:5000/health" >/dev/null; then
              echo "✅ Application démarrée et endpoint /health joignable"
            else
              echo "❌ L'application ne répond pas sur le port 5000"
              echo "--- Dernières logs ---"
              tail -n 80 "${APP_LOG}" || true
              exit 1
            fi
          EOF

      - name: Configure kiosk autostart on Raspberry Pi
        run: |
          set -euo pipefail
          echo "Configuration du mode kiosk au démarrage de session graphique..."
          sshpass -e ssh -o StrictHostKeyChecking=no "${PI_USER}@${PI_HOST}" bash << 'EOF'
            set -euo pipefail
            AUTOSTART_DIR="/home/bioattend/.config/lxsession/LXDE-pi"
            AUTOSTART_FILE="${AUTOSTART_DIR}/autostart"

            mkdir -p "${AUTOSTART_DIR}"

            {
              echo "@xset s off"
              echo "@xset -dpms"
              echo "@xset s noblank"
              echo "@bash -lc 'pkill -x unclutter >/dev/null 2>&1 || true; command -v unclutter >/dev/null 2>&1 && unclutter -idle 0 -root &'"
              echo "@bash -lc 'sleep 6; BROWSER=\"$(command -v chromium || command -v chromium-browser || true)\"; if [ -n \"$BROWSER\" ]; then pkill -f \"chromium.*--app=http://localhost:5000\" >/dev/null 2>&1 || true; \"$BROWSER\" --kiosk --app=http://localhost:5000 --noerrdialogs --disable-infobars; fi'"
            } > "${AUTOSTART_FILE}"

            echo "✅ Fichier autostart kiosk mis à jour: ${AUTOSTART_FILE}"
          EOF